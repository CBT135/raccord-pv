name: Collecte des projets voisins

on:
  schedule:
    - cron: "23 3 * * *"   # chaque jour 03:23 UTC : collecte complète le lundi, préfectures et documents les autres jours
  workflow_dispatch:
    inputs:
      only:
        description: "Sources (pe,novae,mrae,pref)"
        default: "pe,novae,mrae,pref"
      depts:
        description: "Départements pour les préfectures (vide = tous)"
        default: ""
      max_docs:
        description: "Nombre maximal de documents lus"
        default: "2500"

permissions:
  contents: write

concurrency:
  group: collecte-projets
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q beautifulsoup4==4.12.3
      - name: Collecte
        run: |
          set -o pipefail
          ONLY="${{ inputs.only }}"; MAXD="${{ inputs.max_docs }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(date -u +%u)" = "1" ]; then ONLY="pe,novae,mrae,pref"; MAXD=2500; else ONLY="pref"; MAXD=1500; fi
          fi
          python3 scripts/collect_projets.py \
            --only "${ONLY:-pe,novae,mrae,pref}" \
            --depts "${{ inputs.depts }}" \
            --max-docs "${MAXD:-2500}" \
            --pref-batch 16 \
            --budget-min 240 2>&1 | tee collecte.log
      - name: Bilan
        if: always()
        run: cat data/projets-meta.json || true
      - name: Enregistrer (sauf essai limité à quelques départements)
        if: ${{ success() && (inputs.depts == '' || github.event_name == 'schedule') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projets.json data/projets-meta.json data/projets-cache.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -q -m "Projets voisins : collecte du $(date -u +%Y-%m-%d)"
          git pull -q --rebase && git push -q
      - name: Journal (branche collecte-journal)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/journal && cp collecte.log /tmp/journal/ 2>/dev/null || true
          cp data/projets.json data/projets-meta.json /tmp/journal/ 2>/dev/null || true
          cd /tmp/journal && git init -q && git checkout -q -b collecte-journal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Run ${{ github.run_id }} – $(date -u +%F\ %T) – only=${{ inputs.only }} depts=${{ inputs.depts }}" > LISEZMOI.txt
          git add -A && git commit -q -m "Journal de collecte ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" collecte-journal
