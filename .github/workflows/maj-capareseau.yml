name: Mise à jour Capareseau

on:
  schedule:
    - cron: "17 5 3 * *"   # le 3 de chaque mois, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les postes Capareseau
        run: python3 scripts/update_capareseau.py
      - name: Repositionner les postes aux coordonnées aberrantes
        run: |
          pip install -q beautifulsoup4==4.12.3
          python3 scripts/collect_refs.py positions || echo "Repositionnement impossible, postes laissés tels quels"
      - name: Enregistrer si les données ont changé
        run: |
          if git diff --quiet -- data/postes.json; then
            echo "Aucun changement des postes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/postes.json data/meta.json
          git commit -m "Données Capareseau du $(date -u +%Y-%m-%d)"
          git push
