name: Collecte des projets voisins

on:
  schedule:
    - cron: "23 3 * * 1"   # chaque lundi, 03:23 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Sources (pe,novae,mrae,pref)"
        default: "pe,novae,mrae,pref"
      depts:
        description: "Départements pour les préfectures (vide = tous)"
        default: ""
      max_docs:
        description: "Nombre maximal de documents lus"
        default: "2500"

permissions:
  contents: write

concurrency:
  group: collecte-projets
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q beautifulsoup4==4.12.3
      - name: Collecte
        run: |
          python3 scripts/collect_projets.py \
            --only "${{ inputs.only || 'pe,novae,mrae,pref' }}" \
            --depts "${{ inputs.depts }}" \
            --max-docs "${{ inputs.max_docs || '2500' }}" \
            --budget-min 240
      - name: Bilan
        if: always()
        run: cat data/projets-meta.json || true
      - name: Enregistrer (collecte complète uniquement)
        if: ${{ (inputs.only == '' || inputs.only == 'pe,novae,mrae,pref' || github.event_name == 'schedule') && inputs.depts == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projets.json data/projets-meta.json data/projets-cache.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -q -m "Projets voisins : collecte du $(date -u +%Y-%m-%d)"
          git pull -q --rebase && git push -q
      - name: Résultat d'essai
        if: ${{ inputs.depts != '' || (inputs.only != '' && inputs.only != 'pe,novae,mrae,pref') }}
        uses: actions/upload-artifact@v4
        with:
          name: essai-projets
          path: |
            data/projets.json
            data/projets-meta.json
            data/projets-cache.json
